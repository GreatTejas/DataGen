<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
  <title>CareSignal | Clinician review</title>
  <style>
    :root{--ink:#172b3a;--muted:#73818d;--line:#e4e9ed;--paper:#f5f7f8;--white:#fff;--teal:#087f8c;--teal-dark:#066976;--red:#bd4545;--amber:#a86a10;--green:#287c58;--navy:#16384a;--shadow:0 7px 24px #16384a0b}
    *{box-sizing:border-box}body{margin:0;background:var(--paper);color:var(--ink);font:14px/1.45 Inter,ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif}
    .top{height:66px;background:var(--white);border-bottom:1px solid var(--line);display:flex;align-items:center;padding:0 32px;justify-content:space-between;position:sticky;top:0;z-index:3}.brand{display:flex;align-items:center;gap:11px;font-weight:700;font-size:16px;letter-spacing:-.3px}.mark{width:30px;height:30px;border-radius:9px;background:#e0f2f2;color:var(--teal);display:grid;place-items:center;font-weight:800}.top-right{display:flex;align-items:center;gap:17px;color:var(--muted);font-size:12px}.demo{padding:5px 9px;background:#fff6e4;color:#956211;border-radius:20px;font-weight:650}
    main{max-width:1280px;margin:0 auto;padding:27px 28px 44px}.heading{display:flex;justify-content:space-between;align-items:flex-end;margin-bottom:21px}.eyebrow{text-transform:uppercase;letter-spacing:1.15px;color:var(--teal);font-size:10px;font-weight:750}.heading h1{font-size:25px;letter-spacing:-.7px;margin:3px 0 0}.sub{color:var(--muted);margin-top:3px}.refresh{border:1px solid var(--line);border-radius:9px;background:white;padding:9px 12px;color:var(--ink);cursor:pointer;font-weight:600}.metrics{display:grid;grid-template-columns:repeat(4,minmax(120px,1fr));gap:11px;margin-bottom:21px}.metric{background:var(--white);border:1px solid var(--line);border-radius:12px;padding:14px 15px;box-shadow:var(--shadow);min-height:87px}.metric .label{font-size:11px;color:var(--muted);font-weight:600}.metric .value{font-size:22px;font-weight:700;letter-spacing:-.6px;margin-top:5px}.metric .hint{font-size:10px;color:var(--muted);margin-top:1px}.trendline{font-size:11px;color:#49606d;margin:10px 0 2px;padding:8px 10px;background:#f7f9fa;border-radius:8px}
    .workspace{display:grid;grid-template-columns:350px minmax(0,1fr);gap:16px;align-items:start}.panel{border:1px solid var(--line);background:white;border-radius:13px;box-shadow:var(--shadow);overflow:hidden}.panel-head{padding:16px 17px 12px;border-bottom:1px solid var(--line);display:flex;align-items:center;justify-content:space-between}.panel-head h2{font-size:14px;margin:0}.count{font-size:11px;color:var(--muted)}.filter{padding:11px 14px;border-bottom:1px solid var(--line)}.filter input{width:100%;border:1px solid var(--line);border-radius:8px;padding:9px 10px;font:inherit;outline-color:var(--teal)}.case-list{max-height:65vh;overflow:auto}.case{padding:13px 15px;border-bottom:1px solid #eef1f3;cursor:pointer;border-left:3px solid transparent}.case:hover{background:#f8fbfb}.case.selected{background:#edf7f7;border-left-color:var(--teal)}.case-row{display:flex;justify-content:space-between;align-items:center}.pid{font-weight:700}.priority{font-size:10px;font-weight:700;padding:3px 7px;border-radius:20px;background:#eff1f3;color:#667580}.priority.High{background:#ffeded;color:var(--red)}.priority.Medium{background:#fff4df;color:var(--amber)}.case-meta{color:var(--muted);font-size:11px;margin-top:5px}.case-reason{font-size:12px;margin-top:6px;color:#354957;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
    .detail{min-height:570px}.empty{padding:80px 28px;text-align:center;color:var(--muted)}.patient-head{padding:18px 20px 15px;border-bottom:1px solid var(--line);display:flex;justify-content:space-between;gap:15px}.patient-title{display:flex;align-items:center;gap:10px}.patient-title h2{margin:0;font-size:19px}.status-pill{font-size:10px;font-weight:750;letter-spacing:.5px;padding:4px 8px;border-radius:20px;background:#fff2df;color:#965f0a}.patient-desc{color:var(--muted);font-size:12px;margin-top:5px}.patient-time{font-size:11px;color:var(--muted);text-align:right}.content{padding:17px 20px}.section-title{font-size:11px;text-transform:uppercase;letter-spacing:.8px;color:var(--muted);font-weight:750;margin:2px 0 10px}.vitals{display:grid;grid-template-columns:repeat(5,1fr);gap:9px}.vital{border:1px solid var(--line);border-radius:10px;padding:11px 10px}.vital-label{font-size:10px;color:var(--muted);font-weight:600}.vital-value{font-size:20px;font-weight:720;margin-top:4px;letter-spacing:-.4px}.vital-base{font-size:10px;color:var(--muted)}.two{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:16px}.box{border:1px solid var(--line);border-radius:10px;padding:13px 14px}.box p{margin:0;color:#3e5260;font-size:12px}.chips{display:flex;flex-wrap:wrap;gap:6px}.chip{background:#f0f4f6;border-radius:20px;padding:5px 8px;font-size:10px;color:#465966}.factor{padding:6px 0;border-bottom:1px solid #eef1f3;font-size:12px;color:#304653}.factor:last-child{border:0}.reason-box{background:#f3f8f8;border:1px solid #dceeee;margin-top:13px}.reason-top{display:flex;justify-content:space-between;align-items:center;margin-bottom:7px}.reason-top strong{font-size:12px}.reason-top button{border:0;background:none;color:var(--teal);font:inherit;font-size:11px;font-weight:700;cursor:pointer}.reason-copy{font-size:12px;color:#405561}.gemini-tag{font-size:9px;color:var(--teal);font-weight:700}.actions{border-top:1px solid var(--line);padding:14px 20px 17px}.actions-label{display:flex;justify-content:space-between;color:var(--muted);font-size:10px;margin-bottom:9px}.buttons{display:flex;gap:8px;flex-wrap:wrap}.btn{padding:9px 12px;border:1px solid var(--line);border-radius:8px;background:white;font:inherit;font-weight:650;cursor:pointer;color:#344957}.btn:hover{background:#f5f8f9}.btn.primary{background:var(--teal);border-color:var(--teal);color:white}.btn.primary:hover{background:var(--teal-dark)}.btn.danger{color:#a94040}.feedback{display:flex;gap:8px;margin-top:10px}.feedback input{flex:1;min-width:0;border:1px solid var(--line);border-radius:8px;padding:9px 10px;font:inherit;font-size:12px}.feedback .btn{font-size:11px}.audit{margin-top:16px}.audit-list{padding:0 16px 5px}.audit-row{padding:10px 0;border-bottom:1px solid #eef1f3;font-size:11px;display:flex;justify-content:space-between;gap:8px}.audit-row:last-child{border:0}.audit-row span{color:var(--muted)}.notice{color:var(--muted);font-size:10px;margin-top:15px}
    @media(max-width:980px){.metrics{grid-template-columns:repeat(3,1fr)}.workspace{grid-template-columns:300px 1fr}}@media(max-width:700px){.top{padding:0 16px}.top-right{gap:8px}main{padding:20px 13px}.heading{align-items:flex-start}.metrics{grid-template-columns:repeat(2,1fr)}.workspace{grid-template-columns:1fr}.case-list{max-height:260px}.vitals{grid-template-columns:repeat(2,1fr)}.vital:last-child{grid-column:span 2}.two{grid-template-columns:1fr}.patient-head{padding:15px}.content,.actions{padding-left:15px;padding-right:15px}}
  </style>
  <style>
    :root{--ink:#0F172A;--muted:#52677D;--line:#D4E2F0;--paper:#E9F1FA;--white:#FFFFFF;--primary:#00ABE4;--teal:#00ABE4;--teal-dark:#008DBD;--red:#EF4444;--amber:#A86A10;--green:#22C55E;--navy:#0F172A;--shadow:0 7px 24px #0F172A0B}
    .mark{background:#E9F1FA;color:#0F172A}.demo{background:#E9F1FA;color:#0F172A}
    .btn.primary{background:#00ABE4;border-color:#00ABE4;color:#0F172A}.btn.primary:hover{background:#008DBD;border-color:#008DBD;color:#FFFFFF}.btn.danger{color:#DC2626}
    .case:hover{background:#F5F9FD}.case.selected{background:#E9F1FA;border-left-color:#00ABE4}
    .priority.High{background:#FEF2F2;color:#DC2626}.reason-box{background:#E9F1FA;border-color:#B8E8F7}
    .suggestion-badge{display:inline-block;margin:0 0 8px;padding:5px 10px;border-radius:18px;background:#E9F1FA;color:#0F172A;font-size:12px;font-weight:750}.suggestion-pending{background:#FFFFFF;color:#52677D}
  </style>
</head>
<body>
  <header class="top"><div class="brand"><div class="mark">C</div>CareSignal <span style="color:#9aa6ae;font-weight:450">/ Clinician review</span></div><div class="top-right"><span id="mode" class="demo">Demo reasoning</span></div></header>
  <main>
    <div class="heading"><div><div class="eyebrow">Clinical deterioration copilot</div><h1>Review queue</h1></div><button class="refresh" onclick="load()">↻ &nbsp;Refresh data</button></div>
    <div class="workspace">
      <section class="panel"><div class="panel-head"><h2>Patients</h2><span id="case-count" class="count"></span></div><div class="filter"><input id="search" placeholder="Search patient ID" oninput="renderList()"></div><div id="case-list" class="case-list"></div></section>
      <section class="panel detail" id="detail"><div class="empty">Choose a patient to review their observations, evidence, and suggested action.</div></section>
    </div>
    <section class="panel audit"><div class="panel-head"><h2>Recent clinician actions</h2><span class="count">Saved to local audit trail</span></div><div id="audit" class="audit-list"></div></section>
  </main>
  <script>
    let data={cases:[]}, selected=null, lastSuggestion=null;
    const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
    const fmt=(x,n=1)=>Number.isFinite(Number(x))?Number(x).toFixed(n):'—';
    async function load(){try{const r=await fetch('/api/dashboard');data=await r.json();document.getElementById('mode').textContent=data.mode;renderMetrics();renderList();renderAudit();if(selected){const c=data.cases.find(x=>x.patient_id===selected);if(c)renderDetail(c);else selected=null;}if(!selected&&data.cases.length){selected=data.cases[0].patient_id;renderList();renderDetail(data.cases[0]);}}catch(e){document.getElementById('case-list').innerHTML='<div class="empty">Could not load demo data.</div>';}}
    function renderMetrics(){/* Evaluation metrics are kept in the API for reference, not shown in the clinician UI. */}
    function renderList(){const q=document.getElementById('search').value.toLowerCase();const cs=data.cases.filter(c=>c.patient_id.toLowerCase().includes(q));document.getElementById('case-count').textContent=`${cs.length} shown · ${data.patient_count||0} total`;document.getElementById('case-list').innerHTML=cs.map(c=>`<div class="case ${selected===c.patient_id?'selected':''}" onclick="selectCase('${esc(c.patient_id)}')"><div class="case-row"><span class="pid">${esc(c.patient_id)}</span><span class="priority ${c.priority}">${esc(c.priority)} priority</span></div><div class="case-meta">${esc(c.policy)} · ${esc(c.event_time.replace('T',' ').slice(0,16))}</div><div class="case-reason">${esc(c.factors.join(' · '))}</div></div>`).join('')||'<div class="empty">No patients match.</div>';}
    function selectCase(id){selected=id;renderList();renderDetail(data.cases.find(x=>x.patient_id===id));}
    function renderDetail(c){if(!c)return;const v=c.vitals,b=c.baseline,ctx=c.context;const units={heart_rate:'bpm',spo2:'%',respiratory_rate:'/min',systolic_bp:'mmHg',diastolic_bp:'mmHg'};const names={heart_rate:'Heart rate',spo2:'SpO₂',respiratory_rate:'Resp. rate',systolic_bp:'Systolic BP',diastolic_bp:'Diastolic BP'};const vitals=Object.keys(units).map(k=>`<div class="vital"><div class="vital-label">${names[k]}</div><div class="vital-value">${fmt(v[k])}<span style="font-size:11px;font-weight:500;color:#71808a"> ${units[k]}</span></div><div class="vital-base">Baseline ${fmt(b[k])} ${units[k]}</div></div>`).join('');const history=(ctx.relevant_history||[]).filter(x=>x!=='none recorded').join(', ')||'No history recorded';const meds=(ctx.current_medications||[]).filter(x=>x!=='none recorded').join(', ')||'None recorded';document.getElementById('detail').innerHTML=`<div class="patient-head"><div><div class="patient-title"><h2>${esc(c.patient_id)}</h2><span class="status-pill">${esc(c.policy)}</span></div><div class="patient-desc">${ctx.age??'—'} y · ${esc(ctx.sex||'')} · ${esc(c.quality)} signal quality</div></div><div class="patient-time">Latest observation<br><strong>${esc(c.event_time.replace('T',' ').slice(0,16))}</strong></div></div><div class="content"><div class="section-title">Current observations · personal baseline</div><div class="vitals">${vitals}</div><div class="two"><div class="box"><div class="section-title">Relevant context</div><p><b>History:</b> ${esc(history)}<br><b>Medication:</b> ${esc(meds)}<br><b>Creatinine:</b> ${ctx.recent_labs?.creatinine_mg_dl??'—'} mg/dL · <b>WBC:</b> ${ctx.recent_labs?.wbc_k_ul??'—'} K/µL</p></div><div class="box"><div class="section-title">Contributing factors</div>${c.factors.map(x=>`<div class="factor">• ${esc(x)}</div>`).join('')}</div></div><div class="box reason-box"><div class="reason-top"><strong>Evidence summary & recommendation</strong><button onclick="askGemini()">✦ Explain with Gemini</button></div><div id="explanation" class="reason-copy">${esc(c.explanation)}<br><br><b>Suggested next step:</b> ${esc(c.recommendation)}</div><div id="gemini-status" class="gemini-tag" style="margin-top:8px"></div></div></div><div class="actions"><div class="actions-label"><span>Clinician decision</span><span>${c.last_action?`Last decision: ${esc(c.last_action.action)}`:'Decision is recorded in the audit trail'}</span></div><div class="buttons"><button class="btn primary" onclick="act('Accept')">✓ &nbsp;Accept</button><button class="btn danger" onclick="act('Dismiss')">Dismiss</button><button class="btn" onclick="act('Defer')">Defer</button><button class="btn" onclick="act('Investigate')">Investigate</button></div><div class="feedback"><input id="reason" placeholder="Optional reason or feedback for the audit trail"><button class="btn" onclick="act('Investigate')">Save note</button></div></div>`;}
    const renderDetailBase=renderDetail;renderDetail=function(c){renderDetailBase(c);addTrend(c);};
    function addTrend(c){const rows=c.history||[],avg=a=>a.length?a.reduce((s,x)=>s+Number(x),0)/a.length:0;const prior=rows.slice(-20,-10),recent=rows.slice(-10),d=(k)=>avg(recent.map(x=>x[k]))-avg(prior.map(x=>x[k]));const fmtDelta=(n)=>`${n>=0?'↑':'↓'} ${fmt(Math.abs(n))}`;const el=document.createElement('div');el.className='trendline';el.innerHTML=`<b>Recent trend</b> &nbsp;HR ${fmtDelta(d('heart_rate'))} bpm &nbsp;·&nbsp; SpO₂ ${fmtDelta(d('spo2'))} points &nbsp;·&nbsp; RR ${fmtDelta(d('respiratory_rate'))} /min <span style="color:#81909a">(last 10 vs prior 10 readings)</span>`;document.querySelector('#detail .vitals')?.insertAdjacentElement('afterend',el);}
    const renderDetailSuggestion=renderDetail;renderDetail=function(c){lastSuggestion=null;renderDetailSuggestion(c);const title=document.querySelector('.reason-top strong'),button=document.querySelector('.reason-top button'),copy=document.getElementById('explanation');if(title)title.textContent='Gemini action suggestion';if(button)button.textContent='✦ Ask Gemini to choose';if(copy){copy.textContent='Gemini will review this patient’s observations and suggest Accept, Dismiss, Defer, or Investigate. You make the final decision.';const badge=document.createElement('div');badge.id='suggested-action';badge.className='suggestion-badge suggestion-pending';badge.textContent='Suggested action: not generated';copy.insertAdjacentElement('beforebegin',badge);}const actionButtons=document.querySelectorAll('.actions .buttons .btn');actionButtons.forEach(b=>b.className='btn');if(actionButtons[0])actionButtons[0].textContent='Accept';};
    async function act(action){const c=data.cases.find(x=>x.patient_id===selected);if(!c)return;const reason=document.getElementById('reason')?.value||'';try{const r=await fetch('/api/action',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({patient_id:selected,action,reason})});if(!r.ok)throw Error('Could not save');await load();const status=document.querySelector('.actions-label span:last-child');if(status)status.textContent=`Saved: ${action}`;}catch(e){alert('Could not save this decision to the local audit trail.');}}
    async function askGemini(){const c=data.cases.find(x=>x.patient_id===selected);const box=document.getElementById('explanation'),status=document.getElementById('gemini-status');status.textContent='Generating a short evidence summary…';try{const r=await fetch('/api/reason',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({case:c})});const result=await r.json();if(!r.ok)throw Error(result.error||'Gemini request failed');box.textContent=result.text+' Suggested next step: '+c.recommendation;status.textContent=result.mode==='Gemini'?'Gemini generated · based on supplied mock evidence':'Demo mode · set GEMINI_API_KEY to connect Gemini';}catch(e){status.textContent=e.message;}}
    askGemini=async function(){const c=data.cases.find(x=>x.patient_id===selected),box=document.getElementById('explanation'),status=document.getElementById('gemini-status'),badge=document.getElementById('suggested-action');status.textContent='Reviewing patient data and choosing an action…';try{const r=await fetch('/api/reason',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({case:c})});const result=await r.json();if(!r.ok)throw Error(result.error||'Gemini request failed');lastSuggestion={suggested_action:result.suggested_action,reason:result.reason,provider:result.provider};badge.textContent=`Suggested action: ${result.suggested_action}`;badge.classList.remove('suggestion-pending');box.textContent=result.reason;status.textContent=result.mode==='Gemini'?'Gemini suggestion · review before choosing an action':'Demo fallback suggestion · set GEMINI_API_KEY to use Gemini';}catch(e){status.textContent=e.message;}};
    function renderAudit(){const rows=[...(data.audit||[])].reverse();document.getElementById('audit').innerHTML=rows.map(x=>`<div class="audit-row"><div><b>${esc(x.patient_id)}</b> · ${esc(x.action)}${x.reason?' · '+esc(x.reason):''}</div><span>${esc((x.timestamp||'').replace('T',' ').slice(0,16))}</span></div>`).join('')||'<div class="audit-row"><span>No clinician decisions recorded yet.</span></div>';}
    load();
  </script>
</body></html>
